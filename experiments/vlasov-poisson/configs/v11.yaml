model:
  name: VlasovPoisson
  params:
    modes: [16, 16, 16]
    num_fourier_layers: 4
    in_channels: 2
    lifting_channels: 64
    projection_channels: 64
    out_channels: 1
    mid_channels: 32
    activation: GELU
    add_grid: true
    n_fno_blocks_per_layer: 1
    dropout: 0.0

training:
  batch_size: 32
  num_epochs: 50
  max_step: 50
  num_samples: 20000
  split_strategy: interleaved
  train_fraction: 0.8
  learning_rate: 0.0001
  weight_decay: 0.0001
  train_on_residual_derivative: false
  scheduler:
    name: CosineAnnealingLR
    params:
      T_max: 50
      eta_min: 0.000001
  early_stopping:
    patience: 10
    min_delta: 0.001
  seed: 42

logging:
  wandb:
    project: vlasov-poisson
    name: v11
    mode: online
